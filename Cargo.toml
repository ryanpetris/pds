[package]
name = "pds"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.23.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
clap_complete = { version = "=4.6.11", features = ["unstable-dynamic"] }
libc = "0.2"
granit-parser = "2.0.0"
russh = { version = "=0.65.0", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=3.0.1"
tokio-util = { version = "0.7", features = ["rt"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
httpdate = "1"
bytes = "1"
futures-util = "0.3"
percent-encoding = "2"
nix = { version = "0.31", features = ["net"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
serde_yaml_ng = { package = "serde_yaml_bw", version = "2.5.8" }
stacker = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "fs"] }

[dev-dependencies]
rand = "0.10"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
strip = "symbols"
