name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview \
            --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl
          rustup default stable

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang build-essential binutils bash tar gzip coreutils
          cargo install --locked cargo-llvm-cov --version 0.9.1

      - name: Test with coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cargo llvm-cov --locked | tee dist/coverage.txt
          cargo llvm-cov report --html --output-dir dist/coverage
          cargo llvm-cov report --lcov --output-path dist/coverage.lcov
          tar -C dist/coverage -czf dist/coverage-html.tar.gz .
          {
            printf '## Test Coverage\n\n'
            printf '```\n'
            cat dist/coverage.txt
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            dist/coverage.txt
            dist/coverage.lcov
            dist/coverage-html.tar.gz
            dist/coverage/

      - name: Derive version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          describe="$(git describe --tags --long --match 'v*' 2>/dev/null || true)"
          if [ -z "$describe" ]; then
            version="dev"
          elif [[ "$describe" =~ ^(.+)-0-g[0-9a-f]+$ ]]; then
            version="${BASH_REMATCH[1]}"
          elif [[ "$describe" =~ ^(.+)-([0-9]+)-g([0-9a-f]+)$ ]]; then
            version="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}-${BASH_REMATCH[3]}"
          else
            version="$describe"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build Linux binaries
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-release.sh

      - name: Build Arch package (amd64)
        shell: bash
        run: |
          set -euo pipefail
          # Builds pds-<ver>-1-x86_64.pkg.tar.zst inside a clean
          # archlinux:base-devel container and copies it to the repo root.
          # ubuntu-latest ships Docker, so no extra setup is needed.
          make arch-pkg

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-binaries
          path: |
            dist/pds-linux-x86_64.tar.gz
            dist/pds-linux-arm64.tar.gz
            pds-*-x86_64.pkg.tar.zst

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            dist/pds-linux-x86_64.tar.gz
            dist/pds-linux-arm64.tar.gz
            pds-*-x86_64.pkg.tar.zst
            dist/coverage.txt
            dist/coverage.lcov
            dist/coverage-html.tar.gz
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --title "$TAG" --notes "Release $TAG"
          fi
