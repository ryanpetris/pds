name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check minimum Rust version
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 check --locked --all-targets

  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Format
        run: cargo +stable fmt --all -- --check

      - name: Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings

      - name: Test
        run: make test CARGO='cargo +stable'

      - name: Binary compatibility
        run: make compat CARGO='cargo +stable'

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-deny
        run: cargo +stable install --locked cargo-deny --version 0.20.2

      - name: Advisories and licenses
        run: make advisories licenses
